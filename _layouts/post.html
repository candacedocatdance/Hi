---
layout: default
---

<script>
  // Cho widget đàn mèo biết đang xem trang cá nhân của bé nào (so khớp qua url).
  window.CAT_CORNER_SELF_URL = {{ page.url | relative_url | jsonify }};
</script>

<a href="{{ '/' | relative_url }}" class="btn-back-home">← Back home</a>

<article class="post-content-area reveal">

  <div class="cat-cv-header">
    <div class="cat-cv-avatar" id="cat-self-avatar">
      {% if page.image %}
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
      {% else %}
        <div style="width:100%; height:100%; background:#F3E7D2;"></div>
      {% endif %}
    </div>
    <div class="cat-cv-info-title">
      <h1>{{ page.title }}</h1>
      <p class="meta">📋 Page date: {{ page.date | date: "%d/%m/%Y" }}</p>
    </div>
</article>
